name: Radar Conversano - prova manuale
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prova-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Installa dipendenze
        run: python -m pip install -r requirements.txt
      - name: Analizza le due ultime scansioni SRI senza notifiche
        run: python nowcasting.py --test
