name: Radar avvisi - verifica manuale

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  valida-programma:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Installa librerie
        run: python -m pip install -r requirements.txt
      - name: Verifica blocco duplicati e gestione episodi
        run: python -m unittest -v test_alert_runner.py
      - name: Valuta radar e stato in simulazione, senza inviare avvisi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python alert_runner.py --dry-run
